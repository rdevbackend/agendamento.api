<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbearia - Agendamento</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- SweetAlert2 (Notificações Estilizadas) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background: linear-gradient(135deg, #0d0b18 0%, #030206 50%, #130a24 100%);
      background-attachment: fixed;
      color: #F4F4F5;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    .text-muted {
      color: #A1A1AA !important;
    }

    .main-card {
      background: linear-gradient(180deg, #181528 0%, #0F0D1B 100%);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(124, 58, 237, 0.15);
      border: 1px solid #2E2845;
    }

    .custom-input {
      background-color: #1A162B;
      border: 1px solid #2E2845;
      color: #FFFFFF;
      border-radius: 12px;
      padding: 12px 16px;
    }
    .custom-input:focus {
      background-color: #1A162B;
      color: #FFFFFF;
      border-color: #8B5CF6;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
    }
    .custom-input::placeholder {
      color: #A1A1AA;
    }

    .nav-pill-custom {
      background-color: #231E38;
      color: #D4D4D8;
      border-radius: 50px;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid #332B52;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .nav-pill-custom.active {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: #FFFFFF;
      border: none;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }

    .service-card {
      background-color: #1A162B;
      border: 1px solid #2E2845;
      border-radius: 16px;
      padding: 16px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .service-card:hover {
      border-color: #7C3AED;
      transform: translateY(-2px);
    }
    .service-card.selected {
      border: 2px solid #A78BFA;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2) 0%, rgba(109, 40, 217, 0.1) 100%);
    }

    .btn-add {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #3D355C;
      background-color: #231E38;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    .service-card.selected .btn-add {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      border: none;
    }

    .summary-card {
      background-color: #141122;
      border: 1px solid #2E2845;
      border-radius: 20px;
      padding: 24px;
    }

    .btn-continue {
      background-color: #2B2545;
      color: #A1A1AA;
      border-radius: 14px;
      padding: 14px;
      font-weight: 700;
      width: 100%;
      border: 1px solid #3B325C;
      transition: all 0.3s;
    }
    .btn-continue.active {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: #FFFFFF;
      border: none;
      box-shadow: 0 4px 18px rgba(139, 92, 246, 0.5);
      cursor: pointer;
    }

    .time-slot {
      border: 1px solid #2E2845;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      font-weight: 600;
      background-color: #1A162B;
      color: #E4E4E7;
      cursor: pointer;
      transition: all 0.2s;
    }
    .time-slot.selected {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: #FFFFFF;
      border-color: #A78BFA;
    }

    /* Estilo do SweetAlert2 */
    .swal2-popup-dark {
      background: #181528 !important;
      border: 1px solid #2E2845 !important;
      border-radius: 20px !important;
      color: #FFFFFF !important;
      font-family: 'Inter', sans-serif !important;
    }
    .swal2-title-dark {
      color: #FFFFFF !important;
    }
    .swal2-confirm-btn {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%) !important;
      border-radius: 12px !important;
      padding: 12px 28px !important;
      font-weight: 600 !important;
      color: #FFFFFF !important;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4) !important;
    }
    .swal2-cancel-btn {
      background: #231E38 !important;
      border: 1px solid #332B52 !important;
      border-radius: 12px !important;
      padding: 12px 28px !important;
      font-weight: 600 !important;
      color: #A1A1AA !important;
      margin-right: 8px !important;
    }
  </style>
</head>
<body class="py-4">

  <div class="container" style="max-width: 1100px;">
    <div class="main-card p-4 p-md-5">
      
      <!-- Cabeçalho -->
      <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="d-flex align-items-center gap-3">
          <button id="btnVoltar" class="btn btn-outline-light rounded-circle p-2 d-none" style="border-color: #3D355C; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;" onclick="irParaPasso(1)">←</button>
          <h4 class="fw-bold mb-0 text-white" id="tituloPasso">Selecionar serviços</h4>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-7">
          
          <!-- PASSO 1 -->
          <div id="passo1">
            <div class="mb-3">
              <input type="text" id="inputBusca" class="form-control custom-input" placeholder="🔍 Buscar serviço (ex: corte, barba)..." oninput="filtrarServicos()">
            </div>

            <div class="d-flex gap-2 overflow-auto pb-2 mb-4">
              <button class="nav-pill-custom active" onclick="filtrarCategoria('todos', this)">Todos</button>
              <button class="nav-pill-custom" onclick="filtrarCategoria('Cabelo', this)">Cabelo</button>
              <button class="nav-pill-custom" onclick="filtrarCategoria('Barba', this)">Barba</button>
              <button class="nav-pill-custom" onclick="filtrarCategoria('Combo', this)">Combo</button>
              <button class="nav-pill-custom" onclick="filtrarCategoria('Pezinho', this)">Pezinho</button>
            </div>

            <div id="listaServicos" class="d-flex flex-column gap-3"></div>
          </div>

          <!-- PASSO 2 -->
          <div id="passo2" class="d-none">
            
            <div class="mb-4">
              <label class="fw-bold mb-2 text-white">Escolha o Profissional</label>
              <select id="selectBarbeiro" class="form-select custom-input">
                <option value="Sem preferência">Sem preferência (Qualquer barbeiro disponível)</option>
                <option value="Alexandre">Alexandre</option>
                <option value="Lucas Silva">Lucas Silva</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="fw-bold mb-2 text-white">Selecione uma data</label>
              <input type="date" id="inputData" class="form-control custom-input" style="color-scheme: dark;" onchange="carregarHorarios()">
            </div>

            <div class="mb-4">
              <label class="fw-bold mb-2 text-white">Escolha um horário</label>
              <div id="gridHorarios" class="row row-cols-2 row-cols-md-3 g-2"></div>
            </div>

            <div class="border-top pt-4 mt-4" style="border-color: #2E2845 !important;">
              <h6 class="fw-bold mb-3 text-white">Seus dados para agendamento</h6>
              
              <div class="mb-3">
                <label class="small text-muted mb-1">Nome completo</label>
                <input type="text" id="nomeCliente" class="form-control custom-input" placeholder="Digite seu nome">
              </div>

              <div class="mb-3">
                <label class="small text-muted mb-1">WhatsApp / Celular</label>
                <input type="text" id="telCliente" class="form-control custom-input" placeholder="(00) 00000-0000" maxlength="15" oninput="aplicarMascaraTelefone(this)">
              </div>

              <div class="mb-3">
                <label class="small text-muted mb-1">Observações (opcional)</label>
                <textarea id="obsCliente" class="form-control custom-input" rows="2" placeholder="Ex: Tenho alergia a tal produto, prefiro degradê baixo..."></textarea>
              </div>
            </div>

          </div>

        </div>

        <!-- Resumo Lateral -->
        <div class="col-lg-5">
          <div class="summary-card">
            
            <div class="d-flex align-items-center gap-3 mb-4 pb-3" style="border-bottom: 1px solid #2E2845;">
              <div class="rounded-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px; background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%); color: white; font-size: 20px;">
                💈
              </div>
              <div>
                <h6 class="fw-bold mb-0 text-white">Barbearia</h6>
                <small style="color: #A1A1AA;">⭐ 5.0 (205) • endereço</small>
              </div>
            </div>

            <div id="resumoServicos" class="d-flex flex-column gap-3 mb-3">
              <p class="small mb-0" style="color: #A1A1AA;">Nenhum serviço selecionado.</p>
            </div>

            <div id="boxTempo" class="d-none justify-content-between align-items-center mb-3 text-muted small">
              <span>⏱️ Duração estimada:</span>
              <span id="tempoTotal" class="text-white fw-bold">0 min</span>
            </div>

            <div class="d-flex align-items-center justify-content-between pt-3 mb-4" style="border-top: 1px solid #2E2845;">
              <span class="fw-bold text-white">Total</span>
              <span class="fw-bold fs-4" style="color: #A78BFA;" id="totalPreco">R$ 0</span>
            </div>

            <button id="btnContinuar" class="btn btn-continue" disabled onclick="avancarPasso()">Continuar</button>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // URL DA API .NET (SINCRONIZADA COM A PORTA 5000)
    const API_URL = 'http://localhost:5000/api/agendamentos'; 

    function mostrarAlerta(titulo, texto, icone = 'warning') {
      Swal.fire({
        icon: icone,
        title: titulo,
        text: texto,
        customClass: {
          popup: 'swal2-popup-dark',
          title: 'swal2-title-dark',
          confirmButton: 'swal2-confirm-btn'
        },
        buttonsStyling: false
      });
    }

    window.alert = function(msg) {
      mostrarAlerta('Atenção', msg, 'info');
    };

    const servicos = [
      { id: 1, nome: "Corte de cabelo masculino", min: 30, preco: 35, cat: "Cabelo" },
      { id: 2, nome: "Corte mais hidratação", min: 45, preco: 50, cat: "Combo" },
      { id: 3, nome: "Cabelo e barba na navalha", min: 60, preco: 60, cat: "Combo" },
      { id: 4, nome: "Barba desenhada", min: 30, preco: 25, cat: "Barba" },
      { id: 5, nome: "Sobrancelha", min: 10, preco: 15, cat: "Pezinho" },
      { id: 6, nome: "Pigmentação / Platina", min: 60, preco: 55, cat: "Cabelo" }
    ];

    let selecionados = [];
    let passoAtual = 1;
    let horarioEscolhido = '';
    let categoriaAtual = 'todos';

    window.onload = () => {
      renderizarServicos(servicos);
      document.getElementById('inputData').value = new Date().toISOString().split('T')[0];
    };

    function aplicarMascaraTelefone(input) {
      let v = input.value.replace(/\D/g, "");
      v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
      v = v.replace(/(\d)(\d{4})$/, "$1-$2");
      input.value = v;
    }

    function renderizarServicos(lista) {
      const container = document.getElementById('listaServicos');
      if (lista.length === 0) {
        container.innerHTML = '<p class="text-muted small">Nenhum serviço encontrado.</p>';
        return;
      }
      container.innerHTML = lista.map(s => {
        const isSelected = selecionados.some(item => item.id === s.id);
        return `
          <div class="service-card d-flex align-items-center justify-content-between ${isSelected ? 'selected' : ''}" onclick="toggleServico(${s.id})">
            <div>
              <h6 class="fw-bold mb-1 text-white">${s.nome}</h6>
              <small class="d-block mb-2" style="color: #A1A1AA;">⏱️ ${s.min} min</small>
              <span class="fw-bold" style="color: #A78BFA;">R$ ${s.preco}</span>
            </div>
            <div class="btn-add">${isSelected ? '✓' : '+'}</div>
          </div>
        `;
      }).join('');
    }

    function filtrarCategoria(cat, btn) {
      document.querySelectorAll('.nav-pill-custom').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      categoriaAtual = cat;
      filtrarServicos();
    }

    function filtrarServicos() {
      const busca = document.getElementById('inputBusca').value.toLowerCase();
      const filtrados = servicos.filter(s => {
        const bateCategoria = categoriaAtual === 'todos' || s.cat === categoriaAtual;
        const bateBusca = s.nome.toLowerCase().includes(busca);
        return bateCategoria && bateBusca;
      });
      renderizarServicos(filtrados);
    }

    function toggleServico(id) {
      const index = selecionados.findIndex(s => s.id === id);
      if (index > -1) {
        selecionados.splice(index, 1);
      } else {
        selecionados.push(servicos.find(item => item.id === id));
      }
      filtrarServicos();
      atualizarResumo();
    }

    function atualizarResumo() {
      const container = document.getElementById('resumoServicos');
      const totalEl = document.getElementById('totalPreco');
      const boxTempo = document.getElementById('boxTempo');
      const tempoEl = document.getElementById('tempoTotal');
      const btn = document.getElementById('btnContinuar');

      if (selecionados.length === 0) {
        container.innerHTML = '<p class="small mb-0" style="color: #A1A1AA;">Nenhum serviço selecionado.</p>';
        totalEl.innerText = 'R$ 0';
        boxTempo.classList.add('d-none');
        btn.disabled = true;
        btn.classList.remove('active');
        return;
      }

      container.innerHTML = selecionados.map(s => `
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="fw-semibold small text-white">${s.nome}</div>
            <small style="color: #A1A1AA;">${s.min} min</small>
          </div>
          <span class="fw-bold small" style="color: #A78BFA;">R$ ${s.preco}</span>
        </div>
      `).join('');

      const total = selecionados.reduce((acc, curr) => acc + curr.preco, 0);
      const tempoTotal = selecionados.reduce((acc, curr) => acc + curr.min, 0);

      totalEl.innerText = `R$ ${total}`;
      tempoEl.innerText = `${tempoTotal} min`;
      boxTempo.classList.remove('d-none');
      boxTempo.classList.add('d-flex');

      btn.disabled = false;
      btn.classList.add('active');
    }

    async function avancarPasso() {
      if (passoAtual === 1) {
        irParaPasso(2);
      } else if (passoAtual === 2) {
        const nome = document.getElementById('nomeCliente').value.trim();
        const tel = document.getElementById('telCliente').value.trim();
        let barbeiro = document.getElementById('selectBarbeiro').value;
        const data = document.getElementById('inputData').value;
        const obs = document.getElementById('obsCliente').value.trim();

        if (!horarioEscolhido) {
          mostrarAlerta('Horário necessário', 'Por favor, selecione um horário para o atendimento!');
          return;
        }

        if (!nome || !tel) {
          mostrarAlerta('Campos em falta', 'Por favor, preencha o seu nome e telefone.');
          return;
        }

        if (barbeiro === 'Sem preferência') {
          barbeiro = 'Alexandre';
        }

        const listaNomesServicos = selecionados.map(s => s.nome);
        const totalNum = selecionados.reduce((acc, curr) => acc + curr.preco, 0);

        const agendamentoDto = {
          clienteNome: nome,
          clienteTelefone: tel,
          barbeiro: barbeiro,
          dataHora: `${data}T${horarioEscolhido}:00`,
          servicos: listaNomesServicos.join(', '),
          precoTotal: totalNum,
          observacao: obs,
          status: "Confirmado"
        };

        Swal.fire({
          icon: 'question',
          title: '✨ Confirmar Agendamento?',
          html: `
            <div class="text-start fs-6 lh-base px-2">
              <p class="mb-1"><strong>Cliente:</strong> ${nome}</p>
              <p class="mb-1"><strong>Telefone:</strong> ${tel}</p>
              <p class="mb-1"><strong>Barbeiro:</strong> ${barbeiro}</p>
              <p class="mb-1"><strong>Data & Horário:</strong> ${data} às ${horarioEscolhido}</p>
              <p class="mb-1"><strong>Serviços:</strong> ${listaNomesServicos.join(', ')}</p>
              <p class="mb-2"><strong>Total:</strong> <span style="color: #A78BFA; font-weight: 700;">R$ ${totalNum}</span></p>
              ${obs ? `<p class="mb-0 text-warning small mt-2"><strong>Observações:</strong> "${obs}"</p>` : ''}
            </div>
          `,
          showCancelButton: true,
          confirmButtonText: 'Confirmar Agendamento',
          cancelButtonText: 'Cancelar',
          customClass: {
            popup: 'swal2-popup-dark',
            title: 'swal2-title-dark',
            confirmButton: 'swal2-confirm-btn',
            cancelButton: 'swal2-cancel-btn'
          },
          buttonsStyling: false
        }).then(async (result) => {
          if (result.isConfirmed) {
            try {
              const response = await fetch("https://footer-chowtime-outnumber.ngrok-free.dev/api/agendamentos", {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(agendamentoDto)
              });

              if (response.ok) {
                Swal.fire({
                  icon: 'success',
                  title: 'Agendado com sucesso!',
                  text: 'O seu agendamento foi salvo no sistema.',
                  customClass: { popup: 'swal2-popup-dark', title: 'swal2-title-dark', confirmButton: 'swal2-confirm-btn' },
                  buttonsStyling: false
                }).then(() => {
                  location.reload();
                });
              } else {
                mostrarAlerta('Erro', 'Ocorreu um erro na API ao tentar salvar o agendamento.', 'error');
              }
            } catch (error) {
              console.error('Erro na requisição:', error);
              mostrarAlerta('Erro de Conexão', 'Não foi possível conectar com o servidor da API. Certifique-se de que o backend .NET está ativo na porta 5021.', 'error');
            }
          }
        });
      }
    }

    function irParaPasso(passo) {
      passoAtual = passo;
      const p1 = document.getElementById('passo1');
      const p2 = document.getElementById('passo2');
      const btnVoltar = document.getElementById('btnVoltar');
      const titulo = document.getElementById('tituloPasso');

      if (passo === 2) {
        p1.classList.add('d-none');
        p2.classList.remove('d-none');
        btnVoltar.classList.remove('d-none');
        titulo.innerText = 'Profissional, Data e Dados';
        carregarHorarios();
      } else {
        p2.classList.add('d-none');
        p1.classList.remove('d-none');
        btnVoltar.classList.add('d-none');
        titulo.innerText = 'Selecionar serviços';
      }
    }

    function carregarHorarios() {
      const horarios = ['09:00', '09:30', '10:00', '10:30', '11:00', '13:30', '14:00', '15:00', '16:00'];
      const grid = document.getElementById('gridHorarios');
      
      grid.innerHTML = horarios.map(h => `
        <div class="col">
          <div class="time-slot ${horarioEscolhido === h ? 'selected' : ''}" onclick="selecionarHorario('${h}', this)">
            ${h}
          </div>
        </div>
      `).join('');
    }

    function selecionarHorario(hora, el) {
      document.querySelectorAll('.time-slot').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      horarioEscolhido = hora;
    }                                                                                              
  </script>
</body>
</html>
