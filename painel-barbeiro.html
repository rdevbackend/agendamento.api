<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Barbeiro - Borsan's</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- SweetAlert2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background: linear-gradient(135deg, #0d0b18 0%, #030206 50%, #130a24 100%);
      background-attachment: fixed;
      color: #F4F4F5;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    .text-muted {
      color: #A1A1AA !important;
    }

    .main-card {
      background: linear-gradient(180deg, #181528 0%, #0F0D1B 100%);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(124, 58, 237, 0.15);
      border: 1px solid #2E2845;
    }

    .custom-input {
      background-color: #1A162B;
      border: 1px solid #2E2845;
      color: #FFFFFF;
      border-radius: 12px;
      padding: 10px 14px;
    }
    .custom-input:focus {
      background-color: #1A162B;
      color: #FFFFFF;
      border-color: #8B5CF6;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
    }

    .nav-pill-custom {
      background-color: #231E38;
      color: #D4D4D8;
      border-radius: 50px;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid #332B52;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .nav-pill-custom.active {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: #FFFFFF;
      border: none;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }

    .appointment-card {
      background-color: #1A162B;
      border: 1px solid #2E2845;
      border-radius: 16px;
      padding: 20px;
      transition: all 0.2s;
    }
    .appointment-card:hover {
      border-color: #7C3AED;
      transform: translateY(-2px);
    }

    .badge-time {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: #FFFFFF;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .badge-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .status-confirmado { background-color: rgba(59, 130, 246, 0.2); color: #60A5FA; border: 1px solid #2563EB; }
    .status-concluido { background-color: rgba(34, 197, 94, 0.2); color: #4ADE80; border: 1px solid #16A34A; }
    .status-cancelado { background-color: rgba(239, 68, 68, 0.2); color: #F87171; border: 1px solid #DC2626; }

    .summary-box {
      background-color: #141122;
      border: 1px solid #2E2845;
      border-radius: 16px;
      padding: 16px;
    }
  </style>
</head>
<body class="py-4">

  <div class="container" style="max-width: 1100px;">
    <div class="main-card p-4 p-md-5">
      
      <!-- Cabeçalho do Painel do Barbeiro -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 pb-3" style="border-bottom: 1px solid #2E2845;">
        <div>
          <h4 class="fw-bold mb-1 text-white">Painel do Barbeiro 💈</h4>
          <p class="text-muted small mb-0">Gestão de agendamentos e faturamento em tempo real</p>
        </div>
        
        <div class="d-flex align-items-center gap-2">
          <label class="small text-muted text-nowrap">Data:</label>
          <input type="date" id="filtroData" class="form-control custom-input" style="color-scheme: dark;" onchange="filtrarAgendamentos()">
        </div>
      </div>

      <!-- Resumo do Dia -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="summary-box text-center">
            <span class="text-muted small d-block mb-1">Confirmados</span>
            <h4 class="fw-bold text-white mb-0" id="totalAgendados">0</h4>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="summary-box text-center">
            <span class="text-muted small d-block mb-1">Concluídos</span>
            <h4 class="fw-bold text-success mb-0" id="totalConcluidos">0</h4>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="summary-box text-center">
            <span class="text-muted small d-block mb-1">Cancelados</span>
            <h4 class="fw-bold text-danger mb-0" id="totalCancelados">0</h4>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="summary-box text-center">
            <span class="text-muted small d-block mb-1">Faturamento</span>
            <h4 class="fw-bold mb-0" style="color: #A78BFA;" id="faturamentoTotal">R$ 0</h4>
          </div>
        </div>
      </div>

      <!-- Filtros por Status -->
      <div class="d-flex gap-2 overflow-auto pb-2 mb-4">
        <button class="nav-pill-custom active" onclick="filtrarStatus('todos', this)">Todos os Status</button>
        <button class="nav-pill-custom" onclick="filtrarStatus('Confirmado', this)">Confirmados</button>
        <button class="nav-pill-custom" onclick="filtrarStatus('Concluído', this)">Concluídos</button>
        <button class="nav-pill-custom" onclick="filtrarStatus('Cancelado', this)">Cancelados</button>
      </div>

      <!-- Lista de Agendamentos -->
      <div id="listaAgendamentos" class="d-flex flex-column gap-3"></div>

    </div>
  </div>

  <script>
    let agendamentos = [
      { id: 1, horario: "09:00", cliente: "Matheus Santos", telefone: "(16) 99123-4567", servicos: "Corte masculino + Barba", barbeiro: "Kauan Borsan", preco: 60, status: "Confirmado", obs: "Prefere degradê baixo na máquina 1." },
      { id: 2, horario: "10:00", cliente: "Rodrigo Almeida", telefone: "(16) 99876-5432", servicos: "Corte mais hidratação", barbeiro: "Lucas Silva", preco: 50, status: "Concluído", obs: "" },
      { id: 3, horario: "11:00", cliente: "Gabriel Costa", telefone: "(16) 99333-2211", servicos: "Corte de cabelo masculino", barbeiro: "Lucas Silva", preco: 35, status: "Confirmado", obs: "" }
    ];

    let statusAtual = 'todos';

    window.onload = () => {
      document.getElementById('filtroData').value = new Date().toISOString().split('T')[0];
      filtrarAgendamentos();
    };

    function filtrarStatus(status, btn) {
      document.querySelectorAll('.nav-pill-custom').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      statusAtual = status;
      filtrarAgendamentos();
    }

    function filtrarAgendamentos() {
      const filtrados = agendamentos.filter(a => statusAtual === 'todos' || a.status === statusAtual);
      renderizarAgendamentos(filtrados);
      atualizarMetricas();
    }

    function renderizarAgendamentos(lista) {
      const container = document.getElementById('listaAgendamentos');

      if (lista.length === 0) {
        container.innerHTML = '<p class="text-muted text-center py-4">Nenhum agendamento encontrado.</p>';
        return;
      }

      container.innerHTML = lista.map(a => `
        <div class="appointment-card d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3">
          
          <div class="d-flex align-items-start gap-3">
            <span class="badge-time">${a.horario}</span>
            <div>
              <div class="d-flex align-items-center gap-2 mb-1">
                <h6 class="fw-bold mb-0 text-white">${a.cliente}</h6>
                <span class="badge-status status-${a.status.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")}">${a.status}</span>
              </div>
              <p class="small text-muted mb-1"><strong>Serviço:</strong> ${a.servicos}</p>
              <p class="small text-muted mb-1"><strong>Barbeiro:</strong> ${a.barbeiro} • <strong>Tel:</strong> ${a.telefone}</p>
              ${a.obs ? `<p class="small text-warning mb-0">💬 <em>"${a.obs}"</em></p>` : ''}
            </div>
          </div>

          <div class="d-flex flex-row flex-md-column align-items-center align-items-md-end justify-content-between w-100 w-md-auto border-top border-md-0 pt-3 pt-md-0" style="border-color: #2E2845 !important;">
            <span class="fw-bold fs-5 mb-2" style="color: #A78BFA;">R$ ${a.preco}</span>
            <div class="d-flex gap-2">
              ${a.status !== 'Concluído' ? `<button class="btn btn-sm btn-outline-success" onclick="alterarStatus(${a.id}, 'Concluído')">Concluir</button>` : ''}
              ${a.status !== 'Cancelado' ? `<button class="btn btn-sm btn-outline-danger" onclick="alterarStatus(${a.id}, 'Cancelado')">Cancelar</button>` : ''}
              ${a.status !== 'Confirmado' ? `<button class="btn btn-sm btn-outline-primary" onclick="alterarStatus(${a.id}, 'Confirmado')">Reativar</button>` : ''}
            </div>
          </div>

        </div>
      `).join('');
    }

    function alterarStatus(id, novoStatus) {
      const item = agendamentos.find(a => a.id === id);
      if (item) {
        item.status = novoStatus;
        filtrarAgendamentos();
      }
    }

    function atualizarMetricas() {
      const agendados = agendamentos.filter(a => a.status === 'Confirmado').length;
      const concluidos = agendamentos.filter(a => a.status === 'Concluído').length;
      const cancelados = agendamentos.filter(a => a.status === 'Cancelado').length;
      const faturamento = agendamentos.filter(a => a.status !== 'Cancelado').reduce((acc, a) => acc + a.preco, 0);

      document.getElementById('totalAgendados').innerText = agendados;
      document.getElementById('totalConcluidos').innerText = concluidos;
      document.getElementById('totalCancelados').innerText = cancelados;
      document.getElementById('faturamentoTotal').innerText = `R$ ${faturamento}`;
    }
  </script>
</body>
</html>
