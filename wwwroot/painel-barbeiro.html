<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Barbeiro</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background: linear-gradient(135deg, #0d0b18 0%, #030206 50%, #130a24 100%);
      background-attachment: fixed;
      color: #F4F4F5;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    .text-muted { color: #A1A1AA !important; }

    .main-card {
      background: linear-gradient(180deg, #181528 0%, #0F0D1B 100%);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(124, 58, 237, 0.15);
      border: 1px solid #2E2845;
    }

    .custom-input {
      background-color: #1A162B;
      border: 1px solid #2E2845;
      color: #FFFFFF;
      border-radius: 12px;
      padding: 10px 14px;
    }
    .custom-input:focus {
      background-color: #1A162B;
      color: #FFFFFF;
      border-color: #8B5CF6;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
    }

    .nav-pill-custom {
      background-color: #231E38;
      color: #D4D4D8;
      border-radius: 50px;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid #332B52;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .nav-pill-custom.active {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: #FFFFFF;
      border: none;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }

    .appointment-card {
      background-color: #1A162B;
      border: 1px solid #2E2845;
      border-radius: 16px;
      padding: 20px;
      transition: all 0.2s;
    }
    .appointment-card:hover {
      border-color: #7C3AED;
      transform: translateY(-2px);
    }

    .badge-time {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: #FFFFFF;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .badge-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .status-confirmado { background-color: rgba(59, 130, 246, 0.2); color: #60A5FA; border: 1px solid #2563EB; }
    .status-concluido { background-color: rgba(34, 197, 94, 0.2); color: #4ADE80; border: 1px solid #16A34A; }
    .status-cancelado { background-color: rgba(239, 68, 68, 0.2); color: #F87171; border: 1px solid #DC2626; }

    .summary-box {
      background-color: #141122;
      border: 1px solid #2E2845;
      border-radius: 16px;
      padding: 16px;
    }

    .swal2-popup-dark {
      background: #181528 !important;
      border: 1px solid #2E2845 !important;
      border-radius: 20px !important;
      color: #FFFFFF !important;
      font-family: 'Inter', sans-serif !important;
    }
    .swal2-title-dark { color: #FFFFFF !important; }
    .swal2-confirm-btn {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%) !important;
      border-radius: 12px !important;
      padding: 12px 28px !important;
      font-weight: 600 !important;
      color: #FFFFFF !important;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4) !important;
    }
  </style>
</head>
<body class="py-4">

  <div class="container" style="max-width: 1100px;">
    <div class="main-card p-4 p-md-5">
      
      <!-- Cabeçalho -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 pb-3" style="border-bottom: 1px solid #2E2845;">
        <div>
          <h4 class="fw-bold mb-1 text-white">Painel do Barbeiro 💈</h4>
          <p class="text-muted small mb-0">Agenda de: <strong id="nomeBarbeiroLogado" class="text-white">Carregando...</strong></p>
        </div>
        
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-sm btn-outline-light" style="border-color: #3D355C; border-radius: 10px;" onclick="solicitarLogin(true)">🔄 Trocar Barbeiro</button>
          
          <div class="d-flex align-items-center gap-2">
            <label class="small text-muted text-nowrap">Data:</label>
            <input type="date" id="filtroData" class="form-control custom-input" style="color-scheme: dark;" onchange="carregarAgendamentosDaApi()">
          </div>
        </div>
      </div>

      <!-- Resumo de Métricas -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="summary-box text-center">
            <span class="text-muted small d-block mb-1">Confirmados</span>
            <h4 class="fw-bold text-white mb-0" id="totalAgendados">0</h4>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="summary-box text-center">
            <span class="text-muted small d-block mb-1">Concluídos</span>
            <h4 class="fw-bold text-success mb-0" id="totalConcluidos">0</h4>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="summary-box text-center">
            <span class="text-muted small d-block mb-1">Cancelados</span>
            <h4 class="fw-bold text-danger mb-0" id="totalCancelados">0</h4>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="summary-box text-center">
            <span class="text-muted small d-block mb-1">Faturamento</span>
            <h4 class="fw-bold mb-0" style="color: #A78BFA;" id="faturamentoTotal">R$ 0,00</h4>
          </div>
        </div>
      </div>

      <!-- Filtros por Status -->
      <div class="d-flex gap-2 overflow-auto pb-2 mb-4">
        <button class="nav-pill-custom active" onclick="filtrarStatus('todos', this)">Todos os Status</button>
        <button class="nav-pill-custom" onclick="filtrarStatus('Confirmado', this)">Confirmados</button>
        <button class="nav-pill-custom" onclick="filtrarStatus('Concluído', this)">Concluídos</button>
        <button class="nav-pill-custom" onclick="filtrarStatus('Cancelado', this)">Cancelados</button>
      </div>

      <!-- Agendamentos -->
      <div id="listaAgendamentos" class="d-flex flex-column gap-3"></div>

    </div>
  </div>

  <script>
    // URL base do Ngrok configurada corretamente
    const API_URL = 'https://footer-chowtime-outnumber.ngrok-free.dev/api';

    let barbeiroLogado = '';
    let statusAtual = 'todos';
    let agendamentos = [];

    window.onload = () => {
      document.getElementById('filtroData').value = new Date().toISOString().split('T')[0];
      
      const salvo = sessionStorage.getItem('barbeiroLogado');
      if (salvo && (salvo === 'Lucas Silva' || salvo === 'Alexandre')) {
        barbeiroLogado = salvo;
        iniciarPainel();
      } else {
        solicitarLogin();
      }
    };

    function solicitarLogin(forcar = false) {
      Swal.fire({
        title: '🔑 Acesso do Barbeiro',
        html: `
          <p class="small text-muted mb-3">Selecione seu perfil:</p>
          <select id="swalSelectBarbeiro" class="form-select custom-input text-white">
            <option value="Lucas Silva">Lucas Silva</option>
            <option value="Alexandre">Alexandre</option>
          </select>
        `,
        confirmButtonText: 'Acessar Agenda',
        allowOutsideClick: false,
        allowEscapeKey: false,
        customClass: {
          popup: 'swal2-popup-dark',
          title: 'swal2-title-dark',
          confirmButton: 'swal2-confirm-btn'
        },
        buttonsStyling: false,
        preConfirm: () => document.getElementById('swalSelectBarbeiro').value
      }).then((result) => {
        if (result.isConfirmed) {
          barbeiroLogado = result.value;
          sessionStorage.setItem('barbeiroLogado', barbeiroLogado);
          iniciarPainel();
        }
      });
    }

    function iniciarPainel() {
      document.getElementById('nomeBarbeiroLogado').innerText = barbeiroLogado;
      carregarAgendamentosDaApi();
    }

    async function carregarAgendamentosDaApi() {
      const container = document.getElementById('listaAgendamentos');
      container.innerHTML = `<p class="text-muted text-center py-4">Carregando agendamentos do servidor...</p>`;

      try {
        // Adicionada a flag 'ngrok-skip-browser-warning' para evitar a página intermediária do ngrok
        const resposta = await fetch(`${"https://agendamento-api-5ny9.onrender.com/api/agendamentos"}`, {
          headers: {
            'ngrok-skip-browser-warning': 'true'
          }
        });
        
        if (!resposta.ok) throw new Error(`Status ${resposta.status}`);

        const dados = await resposta.json();

        agendamentos = dados.map(a => {
          const rawData = a.dataHora || a.DataHora;
          const dataObj = rawData ? new Date(rawData) : new Date();

          const ano = dataObj.getFullYear();
          const mes = String(dataObj.getMonth() + 1).padStart(2, '0');
          const dia = String(dataObj.getDate()).padStart(2, '0');
          const dataFormatada = `${ano}-${mes}-${dia}`;

          let servicoNome = a.servicos || a.Servicos || a.servico || a.Servico;
          if (!servicoNome || servicoNome.trim() === '') {
            servicoNome = 'Serviço não informado';
          }

          return {
            id: a.id || a.Id,
            horario: dataObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            cliente: a.clienteNome || a.ClienteNome || 'Cliente',
            telefone: a.clienteTelefone || a.ClienteTelefone || '',
            servicos: servicoNome,
            barbeiro: a.barbeiro || a.Barbeiro || '',
            preco: parseFloat(a.precoTotal || a.PrecoTotal || 0),
            status: a.status || a.Status || 'Confirmado',
            obs: a.observacao || a.Observacao || '',
            dataCompleta: dataFormatada
          };
        });

        filtrarAgendamentos();
      } catch (erro) {
        console.error("Erro no carregamento:", erro);
        container.innerHTML = `<p class="text-danger text-center py-4">Erro ao carregar dados da API (404 / Sem resposta). Verifique se o controller no C# está mapeado com [Route("api/[controller]")].</p>`;
      }
    }

    function filtrarStatus(status, btn) {
      document.querySelectorAll('.nav-pill-custom').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      statusAtual = status;
      filtrarAgendamentos();
    }

    function filtrarAgendamentos() {
      const dataSelecionada = document.getElementById('filtroData').value;

      const filtrados = agendamentos.filter(a => {
        const mesmoBarbeiro = a.barbeiro.toLowerCase().trim() === barbeiroLogado.toLowerCase().trim();
        const mesmaData = !dataSelecionada || a.dataCompleta === dataSelecionada;
        const mesmoStatus = statusAtual === 'todos' || a.status === statusAtual;

        return mesmoBarbeiro && mesmaData && mesmoStatus;
      });

      renderizarAgendamentos(filtrados);
      atualizarMetricas();
    }

    function renderizarAgendamentos(lista) {
      const container = document.getElementById('listaAgendamentos');

      if (lista.length === 0) {
        container.innerHTML = `<p class="text-muted text-center py-5 mb-0">Nenhum agendamento encontrado para ${barbeiroLogado} nesta data.</p>`;
        return;
      }

      container.innerHTML = lista.map(a => {
        let classeStatus = 'status-confirmado';
        if (a.status === 'Concluído') classeStatus = 'status-concluido';
        if (a.status === 'Cancelado') classeStatus = 'status-cancelado';

        const telLimpo = a.telefone ? a.telefone.replace(/\D/g, '') : '';

        return `
          <div class="appointment-card d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div class="d-flex align-items-center gap-3">
              <span class="badge-time">${a.horario}</span>
              <div>
                <h6 class="fw-bold mb-1 text-white">${a.cliente}</h6>
                <small class="text-muted d-block">${a.servicos} • <span style="color: #A78BFA; font-weight: 600;">R$ ${a.preco.toFixed(2)}</span></small>
                
                ${telLimpo ? `
                  <small class="d-block mt-1">
                    <a href="https://wa.me/55${telLimpo}" target="_blank" class="text-decoration-none fw-semibold" style="color: #25D366; font-size: 0.85rem;">
                      📱 WhatsApp: ${a.telefone}
                    </a>
                  </small>
                ` : '<small class="text-muted d-block mt-1">📱 Telefone não informado</small>'}

                ${a.obs ? `<div class="small text-warning mt-1">💬 "${a.obs}"</div>` : ''}
              </div>
            </div>

            <div class="d-flex align-items-center justify-content-between justify-content-md-end gap-3">
              <span class="badge-status ${classeStatus}">${a.status}</span>
              
              <div class="dropdown">
                <button class="btn btn-sm btn-outline-light dropdown-toggle" style="border-color: #3D355C; border-radius: 10px;" type="button" data-bs-toggle="dropdown">
                  Ações
                </button>
                <ul class="dropdown-menu dropdown-menu-dark">
                  <li><a class="dropdown-item" href="#" onclick="alterarStatus(${a.id}, 'Concluído')">Mudar para Concluído</a></li>
                  <li><a class="dropdown-item" href="#" onclick="alterarStatus(${a.id}, 'Confirmado')">Mudar para Confirmado</a></li>
                  <li><a class="dropdown-item text-danger" href="#" onclick="alterarStatus(${a.id}, 'Cancelado')">Mudar para Cancelado</a></li>
                </ul>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function atualizarMetricas() {
      const dataSelecionada = document.getElementById('filtroData').value;
      const doDia = agendamentos.filter(a => a.barbeiro.toLowerCase().trim() === barbeiroLogado.toLowerCase().trim() && a.dataCompleta === dataSelecionada);

      const confirmados = doDia.filter(a => a.status === 'Confirmado').length;
      const concluidos = doDia.filter(a => a.status === 'Concluído').length;
      const cancelados = doDia.filter(a => a.status === 'Cancelado').length;
      
      const totalFaturamento = doDia.filter(a => a.status === 'Concluído' || a.status === 'Confirmado').reduce((acc, curr) => acc + curr.preco, 0);

      document.getElementById('totalAgendados').innerText = confirmados;
      document.getElementById('totalConcluidos').innerText = concluidos;
      document.getElementById('totalCancelados').innerText = cancelados;
      document.getElementById('faturamentoTotal').innerText = `R$ ${totalFaturamento.toFixed(2)}`;
    }

    async function alterarStatus(id, novoStatus) {
      try {
        const resposta = await fetch(`${"https://agendamento-api-5ny9.onrender.com/api/agendamentos"}/${id}/status`, {
          method: 'PATCH',
          headers: { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({ status: novoStatus })
        });

        if (!resposta.ok) throw new Error('Falha na atualização');

        const item = agendamentos.find(a => a.id === id);
        if (item) item.status = novoStatus;
        filtrarAgendamentos();
      } catch (erro) {
        console.error("Erro ao atualizar status:", erro);
        const item = agendamentos.find(a => a.id === id);
        if (item) item.status = novoStatus;
        filtrarAgendamentos();
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
